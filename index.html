<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --idol-color: #bb86fc;
            --drama-color: #ff7675;
            --bg-dark: #1a1a24;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Malgun Gothic', sans-serif; overflow: hidden; background-color: #121212; }

        .container { display: flex; width: 100%; height: 100%; }

        /* 왼쪽 사이드바 디자인 */
        .sidebar {
            width: 380px; height: 100%; background-color: var(--bg-dark); color: white;
            display: flex; flex-direction: column; z-index: 100; box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        .header { padding: 20px; text-align: center; border-bottom: 1px solid #333; }
        .header h1 { font-size: 24px; color: var(--idol-color); font-weight: 900; margin-bottom: 5px; }

        /* [조건] 아이돌 뮤비 / 드라마 촬영지 메인 탭 2개 */
        .main-tabs { display: flex; background: #252535; }
        .tab-btn {
            flex: 1; padding: 15px; border: none; background: none; color: #888;
            cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s;
            text-align: center;
        }
        .tab-btn.active.idol { color: var(--idol-color); border-bottom: 3px solid var(--idol-color); background: #1f1f2e; }
        .tab-btn.active.drama { color: var(--drama-color); border-bottom: 3px solid var(--drama-color); background: #1f1f2e; }

        /* 서브 메뉴 (작품 및 아티스트 선택 필터) */
        .sub-menu {
            padding: 12px; display: flex; flex-wrap: wrap; gap: 6px;
            background: #2a2a36; max-height: 120px; overflow-y: auto;
            border-bottom: 1px solid #333;
        }
        .sub-btn {
            padding: 5px 10px; border-radius: 15px; border: 1px solid #555;
            background: #1a1a24; color: #ccc; font-size: 11px; cursor: pointer;
            transition: 0.2s;
        }
        .sub-btn:hover, .sub-btn.active { background: #444; color: white; border-color: white; }

        /* 리스트 영역 */
        .result-list { flex: 1; overflow-y: auto; padding: 10px; }
        .result-item {
            padding: 15px; border-bottom: 1px solid #2d2d3d; cursor: pointer; transition: 0.2s;
            border-radius: 8px; margin-bottom: 6px; background: #222230;
        }
        .result-item:hover { background-color: #2d2d3d; transform: translateY(-2px); }
        .result-item h5 { font-size: 15px; color: #fff; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
        .result-item p { font-size: 12px; color: #bbb; line-height: 1.4; }
        .result-item .region-badge { 
            display: inline-block; padding: 2px 6px; background: #3a3a4a; 
            border-radius: 4px; font-size: 10px; color: #fff; margin-top: 5px;
        }

        /* 오른쪽 지도 */
        .map-area { flex: 1; height: 100%; position: relative; }

        /* [조건] 캐릭터 로딩 화면 조정을 위한 오버레이 */
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
        .char-container { position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .char-img { width: 140px; height: 140px; object-fit: contain; margin-bottom: 15px; }
        .speech-bubble {
            background: white; color: black; padding: 15px 25px; border-radius: 30px;
            font-weight: bold; font-size: 16px; position: relative; max-width: 300px; line-height: 1.5;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-align: center;
        }
        .speech-bubble::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            border-top: 10px solid white; border-left: 10px solid transparent; border-right: 10px solid transparent;
        }

        /* 커스텀 마커 (카메라/비디오 모티브) */
        .custom-marker { font-size: 32px; cursor: pointer; filter: drop-shadow(2px 3px 3px rgba(0,0,0,0.6)); transition: transform 0.2s; }
        .custom-marker:hover { transform: scale(1.2); }

        /* 카카오 지도 인포윈도우 스타일 대치 커스텀 */
        .info-popup { padding: 10px; width: 240px; background: #fff; color: #333; border-radius: 6px; }
        .info-popup h6 { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #111; }
        .info-popup p { font-size: 11px; color: #555; line-height: 1.3; margin-bottom: 8px; }
        
        /* [조건] 업로드된 사진 파일을 연동하여 보여줄 가상 이미지 공간 */
        .info-popup .photo-preview { 
            width: 100%; height: 100px; background-color: #eaeaea; 
            border-radius: 4px; display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: #777; font-weight: bold; overflow: hidden;
            background-size: cover; background-position: center;
        }
    </style>
</head>

        // 전체보기 탭 활성화를 위한 마스터 통합 배열 구축
        function buildTotalList() {
            for(let key in db.idol) {
                if(key !== "전체보기") db.idol["전체보기"] = db.idol["전체보기"].concat(db.idol[key]);
            }
            for(let key in db.drama) {
                if(key !== "전체보기") db.drama["전체보기"] = db.drama["전체보기"].concat(db.drama[key]);
            }
        }
        buildTotalList();

        // 1. 카카오 지도 정상 로딩 시 안전장치 콜백 실행
        kakao.maps.load(function() {
            const mapContainer = document.getElementById('map');
            const mapOptions = { 
                center: new kakao.maps.LatLng(37.5665, 126.9780), 
                level: 5 // [조건] 확대 레벨 5 유지
            };
            map = new kakao.maps.Map(mapContainer, mapOptions);
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            initCurrentLocation();
            switchMainTab('idol'); // 디폴트 실행
        });

        // 2. 권한 허용 기반 현재 위치 트래킹
        function initCurrentLocation() {
            showLoading("사용자의 현재 위치 위성 좌표를<br>추적하고 있어!", "Lucky");
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    map.setCenter(new kakao.maps.LatLng(lat, lon));
                    hideLoading();
                }, function() { hideLoading(); });
            } else { hideLoading(); }
        }

        // 3. [조건] 상단 대분류 메인 탭 전환 컨트롤
        function switchMainTab(category) {
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${category}`).classList.add('active');
            
            const subMenu = document.getElementById('sub-menu');
            subMenu.innerHTML = '';
            const subCategories = Object.keys(db[category]);
            
            subCategories.forEach(name => {
                const btn = document.createElement('button');
                btn.className = 'sub-btn';
                btn.innerText = name;
                btn.onclick = () => {
                    document.querySelectorAll('.sub-btn').forEach(sb => sb.classList.remove('active'));
                    btn.classList.add('active');
                    loadLocations(category, name);
                };
                subMenu.appendChild(btn);
            });
            
            if(subCategories.length > 0) subMenu.firstChild.click();
        }

        // 4. [조건] 다른 화면 넘어가거나 선택 동선 시 전용 로딩 인디케이터 처리
        function loadLocations(category, targetName) {
            let loadingMessage = `🚂 [${targetName}] 성지순례 열차 정비 중...<br>조금만 기다려줘!`;
            let characterSeed = "Lucky";

            // [조건] 선택 콘텐츠 성격에 매칭되는 캐릭터 멘트 커스텀 변형 분기
            if(targetName.includes("뉴진스")) {
                loadingMessage = "🐰 버니즈 크루 소집 완료!<br>파워퍼프걸 캐릭터와 동행 중이야, 조금만 기다려줘!";
                characterSeed = "Anoop";
            } else if (targetName.includes("선재")) {
                loadingMessage = "💛 노란 우산 충전 중...!<br>선재가 대문 앞에서 기다린대! 조금만 기다려줘!";
                characterSeed = "Felix";
            } else if (targetName.includes("방탄")) {
                loadingMessage = "💜 아미 밤 불빛 켜는 중...!<br>보라해 정류장으로 직행할게, 조금만 기다려줘!";
                characterSeed = "Buster";
            }

            showLoading(loadingMessage, characterSeed);

            setTimeout(() => {
                const locations = db[category][targetName];
                displayPlaces(locations);
                hideLoading();
            }, 700);
        }

        // 5. 지도 커스텀 오버레이 배치 및 리스트 동적 제어
        function displayPlaces(places) {
            const listEl = document.getElementById('result-list');
            const bounds = new kakao.maps.LatLngBounds();
            clearMarkers();
            listEl.innerHTML = '';

            if(places.length === 0) {
                listEl.innerHTML = '<p style="padding:15px; font-size:12px; color:#888;">데이터를 구축하고 있습니다.</p>';
                return;
            }

            places.forEach(place => {
                const position = new kakao.maps.LatLng(place.lat, place.lng);
                
                // 마커 엘리먼트 가공
                const markerDiv = document.createElement('div');
                markerDiv.className = 'custom-marker';
                markerDiv.innerHTML = (currentCategory === 'idol') ? '🎵' : '🎬';
                
                const overlay = new kakao.maps.CustomOverlay({
                    position: position, content: markerDiv, yAnchor: 1
                });
                overlay.setMap(map);
                currentMarkers.push(overlay);

                // 왼쪽 리스트 행 삽입
                const itemLi = document.createElement('li');
                itemLi.className = 'result-item';
                itemLi.innerHTML = `
                    <h5>🚂 ${place.title}</h5>
                    <p>${place.desc}</p>
                    <span class="region-badge">${place.region}</span>
                `;
                
                // [조건] 클릭 연동 시 성지순례 멘트 및 가상 업로드 사진 연계 기능 작동
                itemLi.onclick = function() {
                    map.setLevel(5);
                    map.panTo(position);
                    
                    // 인포윈도우 팝업 콘텐츠 구조 바인딩
                    const popupContent = `
                        <div class="info-popup">
                            <h6>🚂 덕질 성지순례 도착!</h6>
                            <p><b>${place.title}</b><br>${place.desc}</p>
                            <div class="photo-preview" style="background-image: url('${place.img}');">
                                [성지 찰칵 사진 연동]
                            </div>
                        </div>
                    `;
                    
                    infowindow.setContent(popupContent);
                    infowindow.open(map, overlay);
                };
                
                markerDiv.onclick = () => { itemLi.onclick(); };
                listEl.appendChild(itemLi);
                bounds.extend(position);
            });
            
            if(places.length > 0) {
                map.setBounds(bounds);
            }
        }

        // 제어용 유틸리티 펑션
        function clearMarkers() {
            currentMarkers.forEach(marker => marker.setMap(null));
            currentMarkers = [];
            infowindow.close();
        }

        function showLoading(message, seed) {
            document.getElementById('speech-text').innerHTML = message;
            document.getElementById('char-icon').src = `https://api.dicebear.com/7.x/adventurer/svg?seed=${seed}`;
            document.getElementById('loading-overlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
