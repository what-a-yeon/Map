<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff3a02888d97191eb336939f8866dc39&libraries=services"></script>
    
    <style>
        /* 기본 여백 초기화 및 전체 화면 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', dotum, sans-serif;
        }

        /* [조건 반영] 화면을 좌우로 2분할하는 컨테이너 설정 */
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 왼쪽 영역: 검색창 및 결과 리스트 (전체 너비의 30%) */
        .sidebar {
            width: 30%;
            height: 100%;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            z-index: 10;
            background-color: white;
        }

        /* 검색창 레이아웃 */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .search-box button {
            padding: 10px 15px;
            background-color: #fee500; /* 카카오 시그니처 노란색 */
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-box button:hover {
            background-color: #fada0a;
        }

        /* 검색 결과 리스트 레이아웃 (결과가 많으면 스크롤 생성) */
        .result-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .result-item {
            padding: 15px 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .result-item:hover {
            background-color: #f9f9f9;
        }

        .result-item h5 {
            font-size: 15px;
            margin-bottom: 5px;
            color: #333;
        }

        .result-item p {
            font-size: 13px;
            color: #666;
        }

        /* 오른쪽 영역: 지도 (전체 너비의 70%) */
        .map-area {
            width: 70%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="keyword" placeholder="장소를 입력하세요 (예: 강남역)" onkeypress="if(event.keyCode==13) searchPlaces()">
                <button onclick="searchPlaces()">검색</button>
            </div>
            <ul id="placesList" class="result-list"></ul>
        </div>

        <div id="map" class="map-area"></div>
    </div>

    <script>
        // 전역 변수 설정 (여러 함수에서 공통으로 사용)
        let map;
        let ps;
        let infowindow;
        let markers = [];

        // [조건 반영] 지도가 스크립트 파일이 제대로 로드된 후에 실행되도록 안전장치 설정
        kakao.maps.load(function() {
            initMap();
        });

        // 지도 및 내부 서비스 초기화 함수
        function initMap() {
            const mapContainer = document.getElementById('map');
            
            // 초기 지도 설정 (위치 권한을 거부하거나 로딩 중일 때 보여줄 기본 위치: 서울시청)
            const defaultOption = {
                center: new kakao.maps.LatLng(37.566826, 126.9786567),
                level: 5 // [조건 반영] 지도 확대 레벨을 5로 지정
            };

            // 지도 객체 생성
            map = new kakao.maps.Map(mapContainer, defaultOption);
            
            // 카카오 장소 검색 객체와 마커 정보창(InfoWindow) 생성
            ps = new kakao.maps.services.Places();
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            // [조건 반영] 페이지가 열리면 브라우저의 Geolocation API로 위치 권한 요청
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;  // 접속한 위도
                    const lon = position.coords.longitude; // 접속한 경도
                    
                    const locPosition = new kakao.maps.LatLng(lat, lon);
                    
                    // 지도의 중심을 사용자의 현재 위치로 변경
                    map.setCenter(locPosition);
                    
                    // 현재 위치에 표시할 마커 생성
                    displayCurrentMarker(locPosition);
                }, function(error) {
                    console.log("위치 권한 획득 실패 혹은 거부됨 기본 위치로 설정됩니다.");
                });
            }
        }

        // 현재 위치 마커 및 텍스트 표시 함수
        function displayCurrentMarker(locPosition) {
            const marker = new kakao.maps.Marker({
                map: map,
                position: locPosition
            });
            
            const iwContent = '<div style="padding:5px; font-size:12px; text-align:center; width:150px;">내 현재 위치</div>';
            const locInfowindow = new kakao.maps.InfoWindow({
                content : iwContent
            });
            
            locInfowindow.open(map, marker);
        }

        // 키워드 장소 검색 실행 함수
        function searchPlaces() {
            const keyword = document.getElementById('keyword').value.trim();

            if (!keyword) {
                alert('검색어를 입력해주세요!');
                return;
            }

            // 카카오 지도 API의 키워드 검색 기능 실행 (성공 시 placesSearchCB 함수 실행)
            ps.keywordSearch(keyword, placesSearchCB);
        }

        // 검색이 완료되었을 때 결과를 처리하는 콜백 함수
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                // 데이터가 올바르게 전송되면 화면과 지도에 뿌려주는 함수 실행
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('검색 결과가 존재하지 않습니다.');
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 중 오류가 발생했습니다.');
            }
        }

        // 왼쪽 리스트 및 지도 위에 검색 결과 마커를 그려주는 함수
        function displayPlaces(places) {
            const listEl = document.getElementById('placesList');
            const bounds = new kakao.maps.LatLngBounds();
            
            // 새로운 검색을 위해 기존 마커와 리스트 내용 삭제
            clearMarkers();
            listEl.innerHTML = '';

            for (let i = 0; i < places.length; i++) {
                const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                
                // 검색된 위치에 마커 생성 및 표시
                const marker = new kakao.maps.Marker({
                    position: placePosition,
                    map: map
                });
                markers.push(marker); // 마커 배열에 저장 (나중에 지우기 위함)

                // HTML 요소를 생성하여 왼쪽 리스트에 삽입
                const itemEl = document.createElement('li');
                itemEl.className = 'result-item';
                itemEl.innerHTML = `
                    <h5>${places[i].place_name}</h5>
                    <p>${places[i].road_address_name ? places[i].road_address_name : places[i].address_name}</p>
                `;

                // 왼쪽 목록의 아이템을 클릭하면 해당 위치로 지도 이동 및 정보창 표시
                itemEl.onclick = function() {
                    map.panTo(placePosition);
                    infowindow.setContent('<div style="padding:5px;font-size:12px;">' + places[i].place_name + '</div>');
                    infowindow.open(map, marker);
                };

                // 지도 위의 마커를 직접 클릭했을 때도 정보창 표시
                kakao.maps.event.addListener(marker, 'click', function() {
                    infowindow.setContent('<div style="padding:5px;font-size:12px;">' + places[i].place_name + '</div>');
                    infowindow.open(map, marker);
                });

                listEl.appendChild(itemEl);
                bounds.extend(placePosition); // 지도 범위 계산을 위해 좌표 누적
            }

            // 검색한 장소들이 지도 한 화면에 다 보이도록 지도 시점 조절
            map.setBounds(bounds);
        }

        // 지도 위의 마커들을 깨끗하게 지워주는 함수
        function clearMarkers() {
            for (let i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }
            markers = [];
        }
    </script>
</body>
</html>
