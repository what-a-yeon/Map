<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', dotum, sans-serif;
        }
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .sidebar {
            width: 30%;
            height: 100%;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            z-index: 10;
            background-color: white;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-box input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .search-box button {
            padding: 10px 15px;
            background-color: #fee500;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .search-box button:hover {
            background-color: #fada0a;
        }
        .result-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }
        .result-item {
            padding: 15px 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        .result-item:hover {
            background-color: #f9f9f9;
        }
        .result-item h5 {
            font-size: 15px;
            margin-bottom: 5px;
            color: #333;
        }
        .result-item p {
            font-size: 13px;
            color: #666;
        }
        .map-area {
            width: 70%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="keyword" placeholder="장소를 입력하세요 (예: 강남역)" onkeypress="if(event.keyCode==13) searchPlaces()">
                <button onclick="searchPlaces()">검색</button>
            </div>
            <ul id="placesList" class="result-list"></ul>
        </div>

        <div id="map" class="map-area"></div>
    </div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff3a02888d97191eb336939f8866dc39&libraries=services"></script>

    <script>
        let map;
        let ps;
        let infowindow;
        let markers = [];

        // 지도가 완전히 로드된 후 실행되도록 보장하는 안전장치
        kakao.maps.load(function() {
            initMap();
        });

        function initMap() {
            const mapContainer = document.getElementById('map');
            
            // 기본 중심좌표 (위치 거부 시 나타날 기본 서울시청 좌표)
            const defaultOption = {
                center: new kakao.maps.LatLng(37.566826, 126.9786567),
                level: 5 // 확대 레벨 5
            };

            map = new kakao.maps.Map(mapContainer, defaultOption);
            ps = new kakao.maps.services.Places();
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            // HTML5의 Geolocation으로 사용할 수 있는지 확인합니다
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const locPosition = new kakao.maps.LatLng(lat, lon);
                    
                    map.setCenter(locPosition);
                    displayCurrentMarker(locPosition);
                }, function(error) {
                    console.log("위치 권한 제한됨: 기본 위치로 지도를 표시합니다.");
                });
            }
        }

        function displayCurrentMarker(locPosition) {
            const marker = new kakao.maps.Marker({
                map: map,
                position: locPosition
            });
            
            const iwContent = '<div style="padding:5px; font-size:12px; text-align:center; width:150px;">내 현재 위치</div>';
            const locInfowindow = new kakao.maps.InfoWindow({
                content : iwContent
            });
            
            locInfowindow.open(map, marker);
        }

        function searchPlaces() {
            const keyword = document.getElementById('keyword').value.trim();

            if (!keyword) {
                alert('검색어를 입력해주세요!');
                return;
            }
            ps.keywordSearch(keyword, placesSearchCB);
        }

        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('검색 결과가 존재하지 않습니다.');
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 중 오류가 발생했습니다.');
            }
        }

        function displayPlaces(places) {
            const listEl = document.getElementById('placesList');
            const bounds = new kakao.maps.LatLngBounds();
            
            clearMarkers();
            listEl.innerHTML = '';

            for (let i = 0; i < places.length; i++) {
                const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                
                const marker = new kakao.maps.Marker({
                    position: placePosition,
                    map: map
                });
                markers.push(marker);

                const itemEl = document.createElement('li');
                itemEl.className = 'result-item';
                itemEl.innerHTML = `
                    <h5>${places[i].place_name}</h5>
                    <p>${places[i].road_address_name ? places[i].road_address_name : places[i].address_name}</p>
                `;

                itemEl.onclick = function() {
                    map.panTo(placePosition);
                    infowindow.setContent('<div style="padding:5px;font-size:12px;">' + places[i].place_name + '</div>');
                    infowindow.open(map, marker);
                };

                kakao.maps.event.addListener(marker, 'click', function() {
                    infowindow.setContent('<div style="padding:5px;font-size:12px;">' + places[i].place_name + '</div>');
                    infowindow.open(map, marker);
                });

                listEl.appendChild(itemEl);
                bounds.extend(placePosition);
            }
            map.setBounds(bounds);
        }

        function clearMarkers() {
            for (let i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }
            markers = [];
        }
    </script>
</body>
</html>
