<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 스포트라이트 (SpotLight) - 덕질 성지순례</title>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff3a02888d97191eb336939f8866dc39&libraries=services"></script>

    <style>
        :root {
            --idol-color: #bb86fc;
            --drama-color: #ff7675;
            --bg-dark: #1a1a24;
            --success-color: #2ecc71;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Malgun Gothic', sans-serif; overflow: hidden; background-color: #121212; }

        .container { display: flex; width: 100%; height: 100%; }

        /* 왼쪽 사이드바 디자인 */
        .sidebar {
            width: 380px; height: 100%; background-color: var(--bg-dark); color: white;
            display: flex; flex-direction: column; z-index: 100; box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        .header { padding: 20px; text-align: center; border-bottom: 1px solid #333; }
        .header h1 { font-size: 24px; color: var(--idol-color); font-weight: 900; margin-bottom: 5px; }

        /* 메인 탭 2개 분할 */
        .main-tabs { display: flex; background: #252535; }
        .tab-btn {
            flex: 1; padding: 15px; border: none; background: none; color: #888;
            cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s;
            text-align: center;
        }
        .tab-btn.active.idol { color: var(--idol-color); border-bottom: 3px solid var(--idol-color); background: #1f1f2e; }
        .tab-btn.active.drama { color: var(--drama-color); border-bottom: 3px solid var(--drama-color); background: #1f1f2e; }

        /* 서브 메뉴 */
        .sub-menu {
            padding: 12px; display: flex; flex-wrap: wrap; gap: 6px;
            background: #2a2a36; max-height: 120px; overflow-y: auto;
            border-bottom: 1px solid #333;
        }
        .sub-btn {
            padding: 5px 10px; border-radius: 15px; border: 1px solid #555;
            background: #1a1a24; color: #ccc; font-size: 11px; cursor: pointer;
            transition: 0.2s;
        }
        .sub-btn:hover, .sub-btn.active { background: #444; color: white; border-color: white; }

        /* 리스트 영역 */
        .result-list { flex: 1; overflow-y: auto; padding: 10px; }
        .result-item {
            padding: 15px; border-bottom: 1px solid #2d2d3d; cursor: pointer; transition: 0.2s;
            border-radius: 8px; margin-bottom: 6px; background: #222230; position: relative;
        }
        .result-item:hover { background-color: #2d2d3d; transform: translateY(-2px); }
        .result-item h5 { font-size: 15px; color: #fff; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
        .result-item p { font-size: 12px; color: #bbb; line-height: 1.4; }
        
        .badge-container { display: flex; gap: 5px; margin-top: 5px; }
        .region-badge { 
            display: inline-block; padding: 2px 6px; background: #3a3a4a; 
            border-radius: 4px; font-size: 10px; color: #fff;
        }
        .visited-badge {
            display: inline-block; padding: 2px 6px; background: var(--success-color);
            border-radius: 4px; font-size: 10px; color: #fff; font-weight: bold;
        }

        /* 오른쪽 지도 */
        .map-area { flex: 1; height: 100%; position: relative; }

        /* 로딩 화면 오버레이 */
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
        .char-container { position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .char-img { width: 140px; height: 140px; object-fit: contain; margin-bottom: 15px; border-radius: 20px; }
        .speech-bubble {
            background: white; color: black; padding: 15px 25px; border-radius: 30px;
            font-weight: bold; font-size: 16px; position: relative; max-width: 300px; line-height: 1.5;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-align: center;
        }
        .speech-bubble::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            border-top: 10px solid white; border-left: 10px solid transparent; border-right: 10px solid transparent;
        }

        /* 커스텀 마커 스타일 */
        .custom-marker { font-size: 32px; cursor: pointer; filter: drop-shadow(2px 3px 3px rgba(0,0,0,0.6)); transition: transform 0.2s; }
        .custom-marker:hover { transform: scale(1.2); }

        /* 인포윈도우 스타일 */
        .info-popup { padding: 8px; width: 260px; background: #fff; color: #333; border-radius: 6px; }
        .info-popup h6 { font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #111; }
        .info-popup p { font-size: 11px; color: #555; line-height: 1.4; margin-bottom: 8px; }
        
        /* 업로드된 사진 파일을 렌더링하는 영역 */
        .info-popup .photo-preview { 
            width: 100%; height: 140px; background-color: #eaeaea; 
            border-radius: 4px; overflow: hidden; margin-bottom: 8px;
            background-size: cover; background-position: center;
            border: 1px solid #ddd;
        }
        
        /* 방문 인증 고정 핀 생성 버튼 */
        .visit-btn {
            width: 100%; padding: 6px; background-color: var(--success-color); color: white;
            border: none; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer;
            transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .visit-btn:hover { background-color: #27ae60; }
        .visit-btn.checked { background-color: #7f8c8d; cursor: default; }
    </style>
</head>
<body>

                ]
            },
            drama: {
                "전체보기": [],
                "선재 업고 튀어": [
                    { id: "drama:sj_home", title: "임솔 집 대문 (행궁동 몽테드)", lat: 37.2882, lng: 127.0142, desc: "솔이가 노란 우산을 쓰고 선재에게 환한 미소로 달려 나가며 첫사랑의 시작을 알리던 파란 대문 앞", region: "경기/근교", img: "./news-p.v1.20240614.18ad0dbea83547fbb4ee7360c0b6583c_P1.jpg" },
                    { id: "drama:sj_lake", title: "자전거 고백 (수원 방화수류정)", lat: 37.2875, lng: 127.0210, desc: "은은한 야간 성곽 조명과 연못에 비친 버드나무가 어우러져 청춘들의 진심 어린 고백을 빛내주던 곳", region: "경기/근교", img: "https://api.dicebear.com/7.x/identicon/svg?seed=sj2" }

        // 데이터 초기 통합 결합 함수
        function initMasterData() {
            for(let key in db.idol) {
                if(key !== "전체보기") db.idol["전체보기"] = db.idol["전체보기"].concat(db.idol[key]);
            }
            for(let key in db.drama) {
                if(key !== "전체보기") db.drama["전체보기"] = db.drama["전체보기"].concat(db.drama[key]);
            }
        }
        initMasterData();

        // 1. 카카오맵 로딩 완료 대기
        kakao.maps.load(function() {
            const container = document.getElementById('map');
            const options = { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 5 };
            map = new kakao.maps.Map(container, options);
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            initTrackingLocation();
            switchMainTab('idol');
        });

        // 2. 현재 위치 권한 처리
        function initTrackingLocation() {
            showLoading("사용자의 스마트폰 GPS 위치 권한을<br>확인하고 있어!", "https://api.dicebear.com/7.x/bottts/svg?seed=base");
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    map.setCenter(new kakao.maps.LatLng(lat, lon));
                    hideLoading();
                }, function() { hideLoading(); });
            } else { hideLoading(); }
        }

        // 3. 메인 상위 탭 전환 시스템
        function switchMainTab(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${cat}`).classList.add('active');
            
            const subMenu = document.getElementById('sub-menu');
            subMenu.innerHTML = '';
            const listItems = Object.keys(db[cat]);
            
            listItems.forEach(name => {
                const btn = document.createElement('button');
                btn.className = 'sub-btn';
                btn.innerText = name;
                btn.onclick = () => {
                    document.querySelectorAll('.sub-btn').forEach(sb => sb.classList.remove('active'));
                    btn.classList.add('active');
                    loadTargetData(cat, name);
                };
                subMenu.appendChild(btn);
            });
            
            if(listItems.length > 0) subMenu.firstChild.click();
        }

        // 4. 로딩 시 맞춤형 캐릭터 및 말풍선 노출 컨트롤
        function loadTargetData(cat, name) {
            let msg = `🚂 [${name}] 성지순례 열차 탑승 중!<br>조금만 기다려줘!`;
            // 제공해주신 일러스트 소스 성격에 맞게 다이스베어 일러스트 씨앗 세팅
            let charUrl = "https://api.dicebear.com/7.x/adventurer/svg?seed=Lucky"; 

            if(name.includes("뉴진스")) {
                msg = "🐰 버니즈 크루 집결 중!<br>디토 감성 충전 중이니까, 조금만 기다려줘!";
                charUrl = "./2022121923123073994_l.jpg"; // 뉴진스 디토 오프닝 이미지 사용
            } else if(name.includes("선재")) {
                msg = "💛 선재가 대문 앞에서 소나기를 피하며 기다린대!<br>우산 챙기는 중이야, 조금만 기다려줘!";
                charUrl = "./iv2G1NvI5y6VnQnHfi1YtNdoYHl9tFB2Df0UhLLSa9ZTBHUKuLDFKn75eFFr3zGlh3aguvIufhnn5WVypzLa7w.webp"; // 선재 일러스트 웹툰 포스터 연동
            } else if(name.includes("방탄")) {
                msg = "💜 보라빛 봄날 정류장행 열차가 출발했어!<br>방탄 소년단과 함께 가자, 조금만 기다려줘!";
                charUrl = "./7q615Xtuc0h2yfdEMmxhzFUJV0Q.jpg"; // BT21 캐릭터 포스터 연동
            } else if(name.includes("블랙핑크")) {
                msg = "💖 마지막처럼 심장이 쿵쾅거리는 중!<br>블핑 아일랜드 입장 중이니, 조금만 기다려줘!";
                charUrl = "./22U46U9MG1_1.jpg"; // 블랙핑크 피규어 캐릭터 이미지 연동
            } else if(name.includes("세븐틴")) {
                msg = "💎 캐럿들을 위한 무지개빛 초이홍 아파트 탐색 중!<br>팀 세븐틴 대기 중, 조금만 기다려줘!";
                charUrl = "./file_1756961683179_152421899_llpl95.webp"; // 미니틴 캐릭터 세트 연동
            }

            showLoading(msg, charUrl);

            setTimeout(() => {
                const locations = db[cat][name];
                renderMapAndList(locations);
                hideLoading();
            }, 800);
        }

        // 5. 마커 렌더링 및 방문 상태에 따른 핀 가공
        function renderMapAndList(places) {
            const listEl = document.getElementById('result-list');
            const bounds = new kakao.maps.LatLngBounds();
            clearMarkers();
            listEl.innerHTML = '';

            if(!places || places.length === 0) {
                listEl.innerHTML = '<p style="padding:15px; font-size:12px; color:#666;">등록된 순례 코스가 없습니다.</p>';
                return;
            }

            places.forEach(p => {
                const pos = new kakao.maps.LatLng(p.lat, p.lng);
                const isVisited = visitedPlaceIds.includes(p.id);
                
                // 마커 엘리먼트 가공
                const markerDiv = document.createElement('div');
                markerDiv.className = 'custom-marker';
                
                // [기능 추가] 성지순례를 다녀왔다면 체크 고정 핀(✅) 이미지 사용, 미방문 시 대분류별 이모지
                markerDiv.innerHTML = isVisited ? '✅' : ((currentCategory === 'idol') ? '🎵' : '🎬');
                
                const overlay = new kakao.maps.CustomOverlay({
                    position: pos, content: markerDiv, yAnchor: 1
                });
                overlay.setMap(map);
                currentMarkers.push(overlay);

                // 왼쪽 리스트 바인딩
                const itemLi = document.createElement('li');
                itemLi.className = 'result-item';
                
                let badgeHtml = `<span class="region-badge">${p.region}</span>`;
                if(isVisited) {
                    badgeHtml += `<span class="visited-badge">📍 성지순례 완료</span>`;
                }

                itemLi.innerHTML = `
                    <h5>🚂 ${p.title}</h5>
                    <p>${p.desc}</p>
                    <div class="badge-container">${badgeHtml}</div>
                `;
                
                // 리스트 아이템 클릭 액션 연동
                itemLi.onclick = function() {
                    map.panTo(pos);
                    
                    // 인포윈도우 내부에 사용자가 업로드한 캡처 씬 사진 가공
                    let popupContent = `
                        <div class="info-popup">
                            <h6>🚂 덕질 성지순례 코스</h6>
                            <div class="photo-preview" style="background-image: url('${p.img}');"></div>
                            <p><b>${p.title}</b><br>${p.desc}</p>
                    `;
                    
                    // 방문 버튼 상태 정의
                    if(isVisited) {
                        popupContent += `<button class="visit-btn checked" disabled>✓ 성지순례 도장 찍기 완료</button></div>`;
                    } else {
                        popupContent += `<button class="visit-btn" onclick="markAsVisited('${p.id}')">📍 다녀왔어요! 인증 핀 꽂기</button></div>`;
                    }
                    
                    infowindow.setContent(popupContent);
                    infowindow.open(map, overlay);
                };
                
                markerDiv.onclick = () => { itemLi.onclick(); };
                listEl.appendChild(itemLi);
                bounds.extend(pos);
            });

            if(places.length > 0) {
                map.setBounds(bounds);
            }
        }

        // [기능 추가] 사용자가 다녀온 장소 고정 핀 스탬프 찍는 핸들러
        window.markAsVisited = function(id) {
            if(!visitedPlaceIds.includes(id)) {
                visitedPlaceIds.push(id);
                infowindow.close();
                
                // 현재 켜져 있는 서브메뉴의 활성화 탭을 수동으로 재클릭 유도하여 마커 실시간 갱신
                const activeSubBtn = document.querySelector('.sub-btn.active');
                if(activeSubBtn) {
                    activeSubBtn.click();
                }
            }
        }

        // 유틸리티 제어 계층 함수
        function clearMarkers() {
            currentMarkers.forEach(m => m.setMap(null));
            currentMarkers = [];
            infowindow.close();
        }

        function showLoading(msg, imgUrl) {
            document.getElementById('speech-text').innerHTML = msg;
            const charIcon = document.getElementById('char-icon');
            charIcon.src = imgUrl;
            
            // 만약 캐릭터 아이콘 주소가 다이스베어 svg가 아니라 실물 이미지 캡처 주소라면 둥글게 디자인 적용
            if(imgUrl.includes('.jpg') || imgUrl.includes('.png') || imgUrl.includes('.webp')) {
                charIcon.style.objectFit = "cover";
            } else {
                charIcon.style.objectFit = "contain";
            }
            
            document.getElementById('loading-overlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
